[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-bank-data"
dynamic = ["version"]
description = "World Bank Data API in Python"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marc Wouts", email = "marc.wouts@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.10"
dependencies = [
    "cachetools",
    "pandas",
    "requests",
]

[project.optional-dependencies]
test = [
  # Pytest
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/mwouts/world_bank_data"

[tool.hatch.version]
path = "world_bank_data/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/world_bank_data",
]

[pycodestyle]
max-line-length = 127

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain if tests don't hit defensive assertion code:
    "raise NotImplementedError",
    "except ImportError",
  ]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
# Use a local (empty) conda<->PyPI name map so locking works without reaching the
# remote mapping service. The only PyPI dependency is the editable self-install,
# and every conda dependency shares its PyPI name, so no overrides are needed.
conda-pypi-map = { conda-forge = ".github/conda-pypi-map.json" }

[tool.pixi.pypi-dependencies]
world-bank-data = { path = ".", extras = ["test"], editable = true }

[tool.pixi.dependencies]
pandas = "*"
requests = "*"
cachetools = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pre-commit = "*"
hatch = "*"

[tool.pixi.tasks]

[tool.pixi.feature.notebook.dependencies]
jupyterlab = ">=4"
plotly = "*"
jupytext = "*"

[tool.pixi.feature.build.dependencies]
python-build = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
# pixi run -e build publish-test
build-dist = "rm -rf dist && python -m build"
publish-test = { depends-on = ["build-dist"], cmd = "twine upload --repository testpypi dist/*" }

[tool.pixi.environments]
default = { solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
